name: Check
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -v
      - name: Build and verify Mac desktop helper
        if: runner.os == 'macOS'
        run: |
          python3 - <<'PY'
          import macos, subprocess
          macos.install()
          subprocess.run(['codesign', '--verify', '--strict', str(macos.APP)], check=True)
          PY
