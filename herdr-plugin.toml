id = "herdr-codex-voice"
name = "Codex Voice"
version = "0.6.0"
min_herdr_version = "0.9.3"
description = "Native Codex voice in remote panes using your microphone computer over SSH (Windows: experimental)."
platforms = ["linux", "macos", "windows"]

[[build]]
platforms = ["linux", "macos"]
command = ["python3", "voice.py", "install"]

[[build]]
platforms = ["windows"]
command = ["py", "-3", "voice.py", "install"]

[[actions]]
id = "setup"
title = "Set up Codex voice"
contexts = ["global", "workspace", "pane"]
platforms = ["linux", "macos"]
command = ["python3", "voice.py", "open-setup"]

[[actions]]
id = "setup-windows"
title = "Set up Codex voice"
contexts = ["global", "workspace", "pane"]
platforms = ["windows"]
command = ["py", "-3", "voice.py", "open-setup"]

[[panes]]
id = "setup"
title = "Codex voice setup"
placement = "popup"
platforms = ["linux", "macos"]
command = ["python3", "voice.py", "setup"]

[[panes]]
id = "setup-windows"
title = "Codex voice setup"
placement = "popup"
platforms = ["windows"]
command = ["py", "-3", "voice.py", "setup"]
